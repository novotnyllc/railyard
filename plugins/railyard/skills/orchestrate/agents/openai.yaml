interface:
  display_name: "Task Orchestrator"
  short_description: "Place authorized work across ready fleet hosts."
  default_prompt: "Use $orchestrate to place a stage when authorized fleet capacity or platform access helps. Keep routine and local-only work local. Prefer a coordinator-owned SSH command for bounded execution. Give each scope one owner and verify the result. Create visible tasks only on explicit user direction. CE owns PR review and CI."
