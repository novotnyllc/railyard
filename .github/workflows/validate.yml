name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.0.0
        with:
          node-version: 24
      - name: Manifest validation
        run: |
          node -e 'for (const f of ["plugins/railyard/.claude-plugin/plugin.json","plugins/railyard/.codex-plugin/plugin.json"]) JSON.parse(require("fs").readFileSync(f))'
      - name: JS contract suites
        run: |
          node --test --test-timeout=60000 --test-force-exit plugins/railyard/scripts/model-routing.test.mjs plugins/railyard/skills/orchestrate/scripts/delivery-contracts.test.mjs plugins/railyard/skills/oracle/scripts/oracle-route.test.mjs plugins/railyard/skills/oracle/scripts/ensure-oracle.test.mjs plugins/railyard/skills/cleanup-codex/scripts/inventory.test.mjs plugins/railyard/skills/cleanup-codex/scripts/snapshot-reap.test.mjs plugins/railyard/skills/cleanup-codex/scripts/recycle.test.mjs plugins/railyard/skills/cleanup-codex/scripts/hook.test.mjs plugins/railyard/skills/cleanup-codex/scripts/canary.test.mjs plugins/railyard/hooks/routing-nudge.test.mjs plugins/railyard/hooks/dispatch-gate.test.mjs plugins/railyard/hooks/routing-charter.test.mjs plugins/railyard/hooks/railyard-retro.test.mjs plugins/railyard/hooks/merge-settlement-gate.test.mjs
