<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" data-sequence="1,2,3,4,5,6,7,8,9" role="img" aria-labelledby="title desc">
  <title id="title">M5 model routing sequence</title>
  <desc id="desc">Nine numbered steps carry a work request through tier resolution, priced admission, one-way claim, carrier work, imported receipt reconciliation, and a durable run-log outcome. Hard constraints disclose a substitute and blocked admission stops before carrier work.</desc>
  <style>
    .bg{fill:#fffaf1}.node{fill:#fffaf1;stroke:#b45309;stroke-width:2}.decision{fill:#f4bf84;stroke:#8b5e34;stroke-width:2}.edge{fill:none;stroke:#8b5e34;stroke-width:2;marker-end:url(#arrow)}.label{fill:#171716;font:600 18px system-ui,sans-serif;text-anchor:middle}.small{fill:#6a6258;font:15px system-ui,sans-serif}.arrow{fill:#8b5e34}
    @media(prefers-color-scheme:dark){.bg{fill:#1c1b19}.node{fill:#25231f;stroke:#dfa05b}.decision{fill:#76512f;stroke:#dfa05b}.edge{stroke:#dfa05b}.label{fill:#eee9df}.small{fill:#b2ada3}.arrow{fill:#dfa05b}}

    .step-badge{fill:#b45309;stroke:#fffaf1;stroke-width:2}.step-number{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.attack-node{fill:#b45309;stroke:#fffaf1;stroke-width:2}.attack-label{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle}.attack-edge{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.step-badge{fill:#dfa05b;stroke:#1c1b19}.step-number{fill:#1c1b19}.attack-node{fill:#dfa05b;stroke:#1c1b19}.attack-label{fill:#1c1b19}.attack-edge{stroke:#dfa05b}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="bg" width="1200" height="930" rx="18"/>
  <g class="edge"><path d="M600 75v45"/><path d="M600 175v55"/><path d="M530 270H320v55"/><path d="M670 270h210v55"/><path d="M880 375c0 60-560 60-560-5"/><path d="M320 375v55"/><path d="M250 480H145v65"/><path d="M390 480h435v65"/><path d="M825 595v55"/><path d="M825 700v55"/><path d="M825 805v55"/></g>
  <g class="small"><text x="490" y="310">yes</text><text x="710" y="310">hard constraint fails</text><text x="595" y="410">next tier / disclosed substitute</text><text x="200" y="525">blocked</text><text x="610" y="525">admitted</text></g>
  <g class="node"><rect x="450" y="25" width="300" height="50" rx="10"/><rect x="400" y="120" width="400" height="55" rx="10"/><rect x="90" y="325" width="230" height="50" rx="10"/><rect x="765" y="325" width="230" height="50" rx="10"/><rect x="205" y="430" width="230" height="50" rx="10"/><rect x="30" y="545" width="230" height="50" rx="10"/><rect x="710" y="545" width="230" height="50" rx="10"/><rect x="710" y="650" width="230" height="50" rx="10"/><rect x="710" y="755" width="230" height="50" rx="10"/><rect x="710" y="860" width="300" height="50" rx="10"/></g>
  <g class="decision"><path d="M600 225l70 45-70 45-70-45z"/></g>
  <g class="label"><text x="600" y="52">Request</text><text x="600" y="70">work request</text><text x="600" y="143">Resolve</text><text x="600" y="161">role → tier ladder</text><text x="600" y="275">Select</text><text x="205" y="351">Route</text><text x="205" y="370">model + transport</text><text x="880" y="356">Next tier / disclosed</text><text x="880" y="373">substitute</text><text x="320" y="451">Admit</text><text x="320" y="470">forecast vs meters</text><text x="145" y="576">Refuse before spend</text><text x="825" y="571">Claim</text><text x="825" y="590">one-way dispatch</text><text x="825" y="681">Carrier runs work</text><text x="825" y="776">Reconcile</text><text x="825" y="795">imported receipt</text><text x="860" y="881">Receipt</text><text x="860" y="900">route + tier + outcome</text></g>
<g class="step-marker" data-step="1" data-step-label="Request" aria-label="Step 1: Request"><circle class="step-badge" cx="466" cy="41" r="15"/><text class="step-number" x="466" y="41">1</text></g><g class="step-marker" data-step="2" data-step-label="Resolve" aria-label="Step 2: Resolve"><circle class="step-badge" cx="416" cy="136" r="15"/><text class="step-number" x="416" y="136">2</text></g><g class="step-marker" data-step="3" data-step-label="Select" aria-label="Step 3: Select"><circle class="step-badge" cx="550" cy="270" r="15"/><text class="step-number" x="550" y="270">3</text></g><g class="step-marker" data-step="4" data-step-label="Route" aria-label="Step 4: Route"><circle class="step-badge" cx="106" cy="341" r="15"/><text class="step-number" x="106" y="341">4</text></g><g class="step-marker" data-step="5" data-step-label="Admit" aria-label="Step 5: Admit"><circle class="step-badge" cx="221" cy="446" r="15"/><text class="step-number" x="221" y="446">5</text></g><g class="step-marker" data-step="6" data-step-label="Claim" aria-label="Step 6: Claim"><circle class="step-badge" cx="726" cy="561" r="15"/><text class="step-number" x="726" y="561">6</text></g><g class="step-marker" data-step="7" data-step-label="Carrier" aria-label="Step 7: Carrier"><circle class="step-badge" cx="726" cy="666" r="15"/><text class="step-number" x="726" y="666">7</text></g><g class="step-marker" data-step="8" data-step-label="Reconcile" aria-label="Step 8: Reconcile"><circle class="step-badge" cx="726" cy="771" r="15"/><text class="step-number" x="726" y="771">8</text></g><g class="step-marker" data-step="9" data-step-label="Receipt" aria-label="Step 9: Receipt"><circle class="step-badge" cx="726" cy="876" r="15"/><text class="step-number" x="726" y="876">9</text></g></svg>
