<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" data-sequence="1,2,3,4,5,6,7,8" role="img" aria-labelledby="title desc">
  <title id="title">M6 review gate sequence</title>
  <desc id="desc">Eight numbered steps carry a ready diff through focused gates, parallel Thermos review, the finding-return loop, settlement, independent review, merge, and post-merge proof.</desc>
  <style>
    .bg{fill:#fffaf1}.node{fill:#fffaf1;stroke:#b45309;stroke-width:2}.edge{fill:none;stroke:#8b5e34;stroke-width:2;marker-end:url(#arrow)}.label{fill:#171716;font:600 16px system-ui,sans-serif;text-anchor:middle}.small{fill:#6a6258;font:14px system-ui,sans-serif}.arrow{fill:#8b5e34}
    @media(prefers-color-scheme:dark){.bg{fill:#1c1b19}.node{fill:#25231f;stroke:#dfa05b}.edge{stroke:#dfa05b}.label{fill:#eee9df}.small{fill:#b2ada3}.arrow{fill:#dfa05b}}

    .step-badge{fill:#b45309;stroke:#fffaf1;stroke-width:2}.step-number{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.attack-node{fill:#b45309;stroke:#fffaf1;stroke-width:2}.attack-label{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle}.attack-edge{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.step-badge{fill:#dfa05b;stroke:#1c1b19}.step-number{fill:#1c1b19}.attack-node{fill:#dfa05b;stroke:#1c1b19}.attack-label{fill:#1c1b19}.attack-edge{stroke:#dfa05b}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="bg" width="1400" height="320" rx="18"/>
  <g class="edge"><path d="M165 125h15"/><path d="M340 125h15"/><path d="M515 125h15"/><path d="M690 125h15"/><path d="M865 125h15"/><path d="M1040 125h15"/><path d="M1215 125h15"/><path d="M530 160c-30 105-430 105-430 0"/></g>
  <g class="small"><text x="385" y="275">findings → fixes</text></g>
  <g class="node"><rect x="30" y="90" width="135" height="70" rx="10"/><rect x="180" y="90" width="160" height="70" rx="10"/><rect x="355" y="90" width="160" height="70" rx="10"/><rect x="530" y="90" width="160" height="70" rx="10"/><rect x="705" y="90" width="160" height="70" rx="10"/><rect x="880" y="90" width="160" height="70" rx="10"/><rect x="1055" y="90" width="160" height="70" rx="10"/><rect x="1230" y="90" width="140" height="70" rx="10"/></g>
  <g class="label"><text x="97" y="116">Ready</text><text x="97" y="138">diff ready</text><text x="260" y="116">Gates</text><text x="260" y="138">focused quality</text><text x="435" y="116">Thermos</text><text x="435" y="138">parallel review</text><text x="610" y="116">Return</text><text x="610" y="138">synthesis + fixes</text><text x="785" y="116">Settle</text><text x="785" y="138">merge settlement</text><text x="960" y="116">Review</text><text x="960" y="138">independent</text><text x="1135" y="120">Merge</text><text x="1135" y="140"></text><text x="1300" y="120">Prove</text><text x="1300" y="140">post-merge</text></g>
<g class="step-marker" data-step="1" data-step-label="Ready" aria-label="Step 1: Ready"><circle class="step-badge" cx="46" cy="106" r="15"/><text class="step-number" x="46" y="106">1</text></g><g class="step-marker" data-step="2" data-step-label="Gates" aria-label="Step 2: Gates"><circle class="step-badge" cx="196" cy="106" r="15"/><text class="step-number" x="196" y="106">2</text></g><g class="step-marker" data-step="3" data-step-label="Thermos" aria-label="Step 3: Thermos"><circle class="step-badge" cx="371" cy="106" r="15"/><text class="step-number" x="371" y="106">3</text></g><g class="step-marker" data-step="4" data-step-label="Return" aria-label="Step 4: Return"><circle class="step-badge" cx="546" cy="106" r="15"/><text class="step-number" x="546" y="106">4</text></g><g class="step-marker" data-step="5" data-step-label="Settle" aria-label="Step 5: Settle"><circle class="step-badge" cx="721" cy="106" r="15"/><text class="step-number" x="721" y="106">5</text></g><g class="step-marker" data-step="6" data-step-label="Review" aria-label="Step 6: Review"><circle class="step-badge" cx="896" cy="106" r="15"/><text class="step-number" x="896" y="106">6</text></g><g class="step-marker" data-step="7" data-step-label="Merge" aria-label="Step 7: Merge"><circle class="step-badge" cx="1071" cy="106" r="15"/><text class="step-number" x="1071" y="106">7</text></g><g class="step-marker" data-step="8" data-step-label="Prove" aria-label="Step 8: Prove"><circle class="step-badge" cx="1246" cy="106" r="15"/><text class="step-number" x="1246" y="106">8</text></g></svg>
