<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 340" data-sequence="1,2,3,4,5,6,7,8,9" role="img" aria-labelledby="title desc">
  <title id="title">M7 skill sync sequence</title>
  <desc id="desc">Nine numbered steps carry one reviewed skill from publication through signed storage, fast pass, fold, definition lookup, native manager action, hook approval, journal evidence, and the same identity everywhere.</desc>
  <style>
    .bg{fill:#fffaf1}.node{fill:#fffaf1;stroke:#b45309;stroke-width:2}.edge{fill:none;stroke:#8b5e34;stroke-width:2;marker-end:url(#arrow)}.label{fill:#171716;font:600 16px system-ui,sans-serif;text-anchor:middle}.small{fill:#6a6258;font:14px system-ui,sans-serif}.arrow{fill:#8b5e34}
    @media(prefers-color-scheme:dark){.bg{fill:#1c1b19}.node{fill:#25231f;stroke:#dfa05b}.edge{stroke:#dfa05b}.label{fill:#eee9df}.small{fill:#b2ada3}.arrow{fill:#dfa05b}}

    .step-badge{fill:#b45309;stroke:#fffaf1;stroke-width:2}.step-number{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.attack-node{fill:#b45309;stroke:#fffaf1;stroke-width:2}.attack-label{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle}.attack-edge{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.step-badge{fill:#dfa05b;stroke:#1c1b19}.step-number{fill:#1c1b19}.attack-node{fill:#dfa05b;stroke:#1c1b19}.attack-label{fill:#1c1b19}.attack-edge{stroke:#dfa05b}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="bg" width="1500" height="340" rx="18"/>
  <g class="edge"><path d="M170 125h10"/><path d="M335 125h10"/><path d="M500 125h10"/><path d="M665 125h10"/><path d="M830 125h10"/><path d="M995 125h10"/><path d="M1160 125h10"/><path d="M1325 125h10"/><path d="M665 160c-40 115-235 115-275 0"/></g>
  <g class="small"><text x="530" y="290">same skill, every machine</text></g>
  <g class="node"><rect x="25" y="90" width="145" height="70" rx="10"/><rect x="180" y="90" width="155" height="70" rx="10"/><rect x="345" y="90" width="155" height="70" rx="10"/><rect x="510" y="90" width="155" height="70" rx="10"/><rect x="675" y="90" width="155" height="70" rx="10"/><rect x="840" y="90" width="155" height="70" rx="10"/><rect x="1005" y="90" width="155" height="70" rx="10"/><rect x="1170" y="90" width="155" height="70" rx="10"/><rect x="1335" y="90" width="140" height="70" rx="10"/></g>
  <g class="label"><text x="97" y="116">Publish</text><text x="97" y="138">skill, one host</text><text x="257" y="116">Store</text><text x="257" y="138">signed commit</text><text x="422" y="116">Fast pass</text><text x="422" y="138">every host ~20m</text><text x="587" y="116">Fold</text><text x="587" y="138">item skills.name</text><text x="752" y="116">Lookup</text><text x="752" y="138">definition</text><text x="917" y="116">Manager</text><text x="917" y="138">native verb</text><text x="1082" y="116">Hooks</text><text x="1082" y="138">approval rerun</text><text x="1247" y="116">Journal</text><text x="1247" y="138">applied / held</text><text x="1405" y="116">Arrive</text><text x="1405" y="138">same skill</text></g>
<g class="step-marker" data-step="1" data-step-label="Publish" aria-label="Step 1: Publish"><circle class="step-badge" cx="41" cy="106" r="15"/><text class="step-number" x="41" y="106">1</text></g><g class="step-marker" data-step="2" data-step-label="Store" aria-label="Step 2: Store"><circle class="step-badge" cx="196" cy="106" r="15"/><text class="step-number" x="196" y="106">2</text></g><g class="step-marker" data-step="3" data-step-label="Fast pass" aria-label="Step 3: Fast pass"><circle class="step-badge" cx="361" cy="106" r="15"/><text class="step-number" x="361" y="106">3</text></g><g class="step-marker" data-step="4" data-step-label="Fold" aria-label="Step 4: Fold"><circle class="step-badge" cx="526" cy="106" r="15"/><text class="step-number" x="526" y="106">4</text></g><g class="step-marker" data-step="5" data-step-label="Lookup" aria-label="Step 5: Lookup"><circle class="step-badge" cx="691" cy="106" r="15"/><text class="step-number" x="691" y="106">5</text></g><g class="step-marker" data-step="6" data-step-label="Manager" aria-label="Step 6: Manager"><circle class="step-badge" cx="856" cy="106" r="15"/><text class="step-number" x="856" y="106">6</text></g><g class="step-marker" data-step="7" data-step-label="Hooks" aria-label="Step 7: Hooks"><circle class="step-badge" cx="1021" cy="106" r="15"/><text class="step-number" x="1021" y="106">7</text></g><g class="step-marker" data-step="8" data-step-label="Journal" aria-label="Step 8: Journal"><circle class="step-badge" cx="1186" cy="106" r="15"/><text class="step-number" x="1186" y="106">8</text></g><g class="step-marker" data-step="9" data-step-label="Arrive" aria-label="Step 9: Arrive"><circle class="step-badge" cx="1351" cy="106" r="15"/><text class="step-number" x="1351" y="106">9</text></g></svg>
