<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-sequence="1,2,3,4,5" role="img" aria-labelledby="title desc">
  <title id="title">M3 trust ratchet sequence</title>
  <desc id="desc">Five numbered steps carry a roster edit from its parent-position question through independent parent verification to accepted advancement or a named held alert.</desc>
  <style>
    .bg{fill:#fffaf1}.actor{fill:#f4bf84;stroke:#8b5e34;stroke-width:2}.node{fill:#fffaf1;stroke:#b45309;stroke-width:2}.edge{stroke:#8b5e34;stroke-width:2;marker-end:url(#arrow)}.label{fill:#171716;font:600 18px system-ui,sans-serif;text-anchor:middle}.small{fill:#6a6258;font:15px system-ui,sans-serif;text-anchor:middle}.arrow{fill:#8b5e34}
    @media(prefers-color-scheme:dark){.bg{fill:#1c1b19}.actor{fill:#76512f;stroke:#dfa05b}.node{fill:#25231f;stroke:#dfa05b}.edge{stroke:#dfa05b}.label{fill:#eee9df}.small{fill:#b2ada3}.arrow{fill:#dfa05b}}

    .step-badge{fill:#b45309;stroke:#fffaf1;stroke-width:2}.step-number{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.attack-node{fill:#b45309;stroke:#fffaf1;stroke-width:2}.attack-label{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle}.attack-edge{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.step-badge{fill:#dfa05b;stroke:#1c1b19}.step-number{fill:#1c1b19}.attack-node{fill:#dfa05b;stroke:#1c1b19}.attack-label{fill:#1c1b19}.attack-edge{stroke:#dfa05b}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="bg" width="1000" height="520" rx="18"/>
  <g class="actor"><rect x="90" y="30" width="220" height="55" rx="10"/><rect x="390" y="30" width="220" height="55" rx="10"/><rect x="690" y="30" width="220" height="55" rx="10"/></g>
  <g class="label"><text x="200" y="63">Roster at parent</text><text x="500" y="63">New commit</text><text x="800" y="63">Every host</text></g>
  <g stroke="#8b5e34" stroke-width="2" stroke-dasharray="7 7"><path d="M200 85v370"/><path d="M500 85v370"/><path d="M800 85v370"/></g>
  <g class="edge"><path d="M500 145H205"/><path d="M205 205h295"/><path d="M500 330h295"/><path d="M500 405h295"/></g>
  <g class="small"><text x="350" y="137">Ask · who signed me?</text><text x="350" y="197">Answer · trusted at parent? class permits paths?</text><text x="650" y="322">trusted at parent</text><text x="650" y="397">unknown / removed / class refusal</text></g>
  <g class="node"><rect x="325" y="250" width="350" height="58" rx="10"/><rect x="690" y="350" width="220" height="70" rx="10"/><rect x="690" y="430" width="220" height="70" rx="10"/></g>
  <g class="label"><text x="500" y="275">Verify · EVERY parent verifies</text><text x="800" y="380">Accept; roster</text><text x="800" y="402">advances</text><text x="800" y="460">Hold · held items</text><text x="800" y="482">+ alert by name</text></g>
<g class="step-marker" data-step="1" data-step-label="Ask" aria-label="Step 1: Ask"><circle class="step-badge" cx="480" cy="145" r="15"/><text class="step-number" x="480" y="145">1</text></g><g class="step-marker" data-step="2" data-step-label="Answer" aria-label="Step 2: Answer"><circle class="step-badge" cx="300" cy="205" r="15"/><text class="step-number" x="300" y="205">2</text></g><g class="step-marker" data-step="3" data-step-label="Verify" aria-label="Step 3: Verify"><circle class="step-badge" cx="341" cy="266" r="15"/><text class="step-number" x="341" y="266">3</text></g><g class="step-marker" data-step="4" data-step-label="Accept" aria-label="Step 4: Accept"><circle class="step-badge" cx="706" cy="366" r="15"/><text class="step-number" x="706" y="366">4</text></g><g class="step-marker" data-step="5" data-step-label="Hold" aria-label="Step 5: Hold"><circle class="step-badge" cx="706" cy="446" r="15"/><text class="step-number" x="706" y="446">5</text></g></svg>
