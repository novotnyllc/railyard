<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-sequence="1,2,3,4,5,6,7,8,9" role="img" aria-labelledby="title desc">
  <title id="title">M4 trust boundaries and attack-shape sequence</title>
  <desc id="desc">Nine numbered steps carry owner instruction through signing, store transport, parent-position verification, propagation gates, and apply or hold outcomes. Three dashed attack lanes show a stolen machine key, replay or downgrade, and hub credential theft reaching distinct stopping gates and named residuals.</desc>
  <style>
    .bg{fill:#fffaf1}.zone{fill:#f4bf8440;stroke:#b45309;stroke-width:2;stroke-dasharray:8 6}.node{fill:#fffaf1;stroke:#b45309;stroke-width:2}.edge{fill:none;stroke:#8b5e34;stroke-width:2;marker-end:url(#arrow)}.label{fill:#171716;font:600 18px system-ui,sans-serif;text-anchor:middle}.small{fill:#6a6258;font:15px system-ui,sans-serif;text-anchor:middle}.arrow{fill:#8b5e34}.attack-node{fill:#b45309;stroke:#fffaf1;stroke-width:2}.attack-label{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle}.attack-gate{fill:#fffaf1;stroke:#b45309;stroke-width:2}.attack-gate-label{fill:#171716;font:600 16px system-ui,sans-serif;text-anchor:middle}.attack-edge{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.bg{fill:#1c1b19}.zone{fill:#76512f55;stroke:#dfa05b}.node{fill:#25231f;stroke:#dfa05b}.edge{stroke:#dfa05b}.label{fill:#eee9df}.small{fill:#b2ada3}.arrow{fill:#dfa05b}.attack-node{fill:#dfa05b;stroke:#1c1b19}.attack-label{fill:#1c1b19}.attack-gate{fill:#25231f;stroke:#dfa05b}.attack-gate-label{fill:#eee9df}.attack-edge{stroke:#dfa05b}}
    .step-badge{fill:#b45309;stroke:#fffaf1;stroke-width:2}.step-number{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
    @media(prefers-color-scheme:dark){.step-badge{fill:#dfa05b;stroke:#1c1b19}.step-number{fill:#1c1b19}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="bg" width="1200" height="900" rx="18"/>
  <rect class="zone" x="30" y="25" width="1140" height="100" rx="14"/><text class="label" x="600" y="52">Owner</text><rect class="node" x="430" y="65" width="340" height="45" rx="10"/><text class="label" x="600" y="94">Owner instruction chain</text>
  <rect class="zone" x="35" y="165" width="430" height="320" rx="14"/><text class="label" x="250" y="195">Enrolled host (one machine)</text>
  <rect class="node" x="85" y="235" width="145" height="55" rx="10"/><text class="label" x="157" y="268">Key · signing key</text><rect class="node" x="275" y="235" width="145" height="55" rx="10"/><text class="label" x="347" y="268">Sign · signed commits</text><rect class="node" x="125" y="365" width="250" height="70" rx="10"/><text class="label" x="250" y="394">roundhouse-trustd</text><text class="label" x="250" y="416">root-owned roster / refs</text>
  <rect class="zone" x="505" y="165" width="265" height="320" rx="14"/><text class="label" x="637" y="195">Store boundary (transport)</text><rect class="node" x="545" y="295" width="185" height="70" rx="20"/><text class="label" x="637" y="325">Store · private</text><text class="label" x="637" y="347">repository</text>
  <rect class="zone" x="810" y="165" width="355" height="320" rx="14"/><text class="label" x="987" y="195">Every other host</text><rect class="node" x="850" y="225" width="275" height="70" rx="10"/><text class="label" x="987" y="255">Verify · ratchet</text><text class="label" x="987" y="277">per commit</text><rect class="node" x="850" y="325" width="275" height="45" rx="10"/><text class="label" x="987" y="353">Gate · propagation</text><rect class="node" x="850" y="410" width="125" height="55" rx="10"/><rect class="node" x="1000" y="410" width="125" height="55" rx="10"/><text class="label" x="912" y="440">Outcome · apply</text><text class="label" x="1062" y="440">Outcome · hold</text><text class="small" x="912" y="458">after evidence</text><text class="small" x="1062" y="458">+ named alert</text>
  <g class="edge"><path d="M600 110v55"/><path d="M157 290v75"/><path d="M230 262h45"/><path d="M420 262c90 0 75 68 125 68"/><path d="M730 330h120"/><path d="M987 295v30"/><path d="M987 370v40"/><path d="M987 370c0 35-75 25-75 40"/><path d="M987 370c0 35 75 25 75 40"/></g>
  <path class="edge" d="M375 400c180-15 340-90 475-140" stroke-dasharray="4 5"/>
  <text class="small" x="245" y="342">trust material</text><text class="small" x="490" y="300">signed history</text>
  <text class="small" x="600" y="530">8 · Contain: each gate stops its attempt · 9 · Residual: named remainder</text>
  <text class="small" x="600" y="548">attack lanes: dashed attempt → stopping gate → named residual</text>
  <g class="attack-lanes">
    <rect class="attack-node" x="40" y="570" width="220" height="55" rx="10"/><text class="attack-label" x="150" y="592">ATTEMPT A</text><text class="attack-label" x="150" y="612">stolen machine key</text>
    <rect class="attack-gate" x="315" y="570" width="255" height="55" rx="10"/><text class="attack-gate-label" x="442" y="592">A gate: parent / class</text><text class="attack-gate-label" x="442" y="612">scope</text>
    <rect class="node" x="625" y="570" width="535" height="55" rx="10"/><text class="label" x="892" y="592">A residual: bounded authority</text><text class="label" x="892" y="612">until retirement</text>
    <path class="attack-edge" d="M260 597h55"/><path class="edge" d="M570 597h55"/>

    <rect class="attack-node" x="40" y="665" width="220" height="55" rx="10"/><text class="attack-label" x="150" y="687">ATTEMPT B</text><text class="attack-label" x="150" y="707">replay / downgrade</text>
    <rect class="attack-gate" x="315" y="665" width="255" height="55" rx="10"/><text class="attack-gate-label" x="442" y="687">B gate: ancestry /</text><text class="attack-gate-label" x="442" y="707">high-water</text>
    <rect class="node" x="625" y="665" width="535" height="55" rx="10"/><text class="label" x="892" y="697">B residual: offline persistence</text>
    <path class="attack-edge" d="M260 692h55"/><path class="edge" d="M570 692h55"/>

    <rect class="attack-node" x="40" y="760" width="220" height="55" rx="10"/><text class="attack-label" x="150" y="782">ATTEMPT C</text><text class="attack-label" x="150" y="802">hub credential theft</text>
    <rect class="attack-gate" x="315" y="760" width="255" height="55" rx="10"/><text class="attack-gate-label" x="442" y="782">C gate: store</text><text class="attack-gate-label" x="442" y="802">transports only</text>
    <rect class="node" x="625" y="760" width="535" height="55" rx="10"/><text class="label" x="892" y="792">C residual: disclosure / availability</text>
    <path class="attack-edge" d="M260 787h55"/><path class="edge" d="M570 787h55"/>
  </g>
  <g class="step-marker" data-step="1" data-step-label="Instruction" aria-label="Step 1: Instruction"><circle class="step-badge" cx="446" cy="87" r="15"/><text class="step-number" x="446" y="87">1</text></g><g class="step-marker" data-step="2" data-step-label="Key" aria-label="Step 2: Key"><circle class="step-badge" cx="101" cy="216" r="15"/><text class="step-number" x="101" y="216">2</text></g><g class="step-marker" data-step="3" data-step-label="Sign" aria-label="Step 3: Sign"><circle class="step-badge" cx="291" cy="216" r="15"/><text class="step-number" x="291" y="216">3</text></g><g class="step-marker" data-step="4" data-step-label="Store" aria-label="Step 4: Store"><circle class="step-badge" cx="561" cy="276" r="15"/><text class="step-number" x="561" y="276">4</text></g><g class="step-marker" data-step="5" data-step-label="Verify" aria-label="Step 5: Verify"><circle class="step-badge" cx="866" cy="206" r="15"/><text class="step-number" x="866" y="206">5</text></g><g class="step-marker" data-step="6" data-step-label="Gate" aria-label="Step 6: Gate"><circle class="step-badge" cx="866" cy="306" r="15"/><text class="step-number" x="866" y="306">6</text></g><g class="step-marker" data-step="7" data-step-label="Outcome" aria-label="Step 7: Outcome"><circle class="step-badge" cx="866" cy="391" r="15"/><text class="step-number" x="866" y="391">7</text></g><g class="step-marker" data-step="8" data-step-label="Contain" aria-label="Step 8: Contain"><circle class="step-badge" cx="326" cy="552" r="15"/><text class="step-number" x="326" y="552">8</text></g><g class="step-marker" data-step="9" data-step-label="Residual" aria-label="Step 9: Residual"><circle class="step-badge" cx="636" cy="552" r="15"/><text class="step-number" x="636" y="552">9</text></g>
</svg>
