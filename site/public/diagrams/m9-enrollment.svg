<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" data-sequence="1,2,3,4,5,6,7,8" role="img" aria-labelledby="title desc">
  <title id="title">M9 sponsor enrollment sequence</title>
  <desc id="desc">Eight numbered steps carry one owner instruction through trusted sponsor contact, target preparation, target-generated key and possession proof, roster publication, and main-at-origin arrival with a bounded soak.</desc>
  <style>
    .bg{fill:#fffaf1}.actor{fill:#f4bf84;stroke:#8b5e34;stroke-width:2}.node{fill:#fffaf1;stroke:#b45309;stroke-width:2}.edge{stroke:#8b5e34;stroke-width:2;marker-end:url(#arrow)}.label{fill:#171716;font:600 17px system-ui,sans-serif;text-anchor:middle}.small{fill:#6a6258;font:15px system-ui,sans-serif;text-anchor:middle}.arrow{fill:#8b5e34}
    @media(prefers-color-scheme:dark){.bg{fill:#1c1b19}.actor{fill:#76512f;stroke:#dfa05b}.node{fill:#25231f;stroke:#dfa05b}.edge{stroke:#dfa05b}.label{fill:#eee9df}.small{fill:#b2ada3}.arrow{fill:#dfa05b}}

    .step-badge{fill:#b45309;stroke:#fffaf1;stroke-width:2}.step-number{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.attack-node{fill:#b45309;stroke:#fffaf1;stroke-width:2}.attack-label{fill:#fffaf1;font:700 14px system-ui,sans-serif;text-anchor:middle}.attack-edge{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.step-badge{fill:#dfa05b;stroke:#1c1b19}.step-number{fill:#1c1b19}.attack-node{fill:#dfa05b;stroke:#1c1b19}.attack-label{fill:#1c1b19}.attack-edge{stroke:#dfa05b}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <rect class="bg" width="1100" height="720" rx="18"/>
  <g class="actor"><rect x="55" y="30" width="220" height="55" rx="10"/><rect x="440" y="30" width="220" height="55" rx="10"/><rect x="825" y="30" width="220" height="55" rx="10"/></g>
  <g class="label"><text x="165" y="63">Owner (one instruction)</text><text x="550" y="63">Sponsor host (enrolled)</text><text x="935" y="63">New host</text></g>
  <g stroke="#8b5e34" stroke-width="2" stroke-dasharray="7 7"><path d="M165 85v610"/><path d="M550 85v610"/><path d="M935 85v610"/></g>
  <g class="edge"><path d="M165 145h385"/><path d="M550 215h385"/><path d="M550 285h385"/><path d="M935 375H550"/><path d="M550 455h385"/><path d="M550 535h-385"/></g>
  <g class="small"><text x="355" y="137">Ask · fleet-add host-a</text><text x="742" y="207">Contact · trusted SSH lane</text><text x="742" y="277">Prepare · prerequisites + fleet-init</text><text x="742" y="367">Prove · pubkey + possession proof</text><text x="742" y="447">Return · remote URL + store data</text><text x="355" y="527">Publish · commit roster line, push</text></g>
  <g class="node"><rect x="365" y="165" width="370" height="50" rx="10"/><rect x="365" y="235" width="370" height="50" rx="10"/><rect x="745" y="345" width="380" height="60" rx="10"/><rect x="365" y="425" width="370" height="50" rx="10"/><rect x="175" y="505" width="370" height="50" rx="10"/><rect x="365" y="600" width="370" height="65" rx="10"/></g>
  <g class="label"><text x="550" y="196">Contact · reach new host</text><text x="550" y="266">Prepare · install prerequisites</text><text x="935" y="371">Key · mint own key</text><text x="935" y="393">Prove · return proof</text><text x="550" y="456">Return · remote URL + store_id</text><text x="360" y="536">Publish · main@origin</text><text x="550" y="626">Arrive · writes soak 24h</text><text x="550" y="648">evidence paths live immediately</text></g>
<g class="step-marker" data-step="1" data-step-label="Ask" aria-label="Step 1: Ask"><circle class="step-badge" cx="181" cy="145" r="15"/><text class="step-number" x="181" y="145">1</text></g><g class="step-marker" data-step="2" data-step-label="Contact" aria-label="Step 2: Contact"><circle class="step-badge" cx="381" cy="181" r="15"/><text class="step-number" x="381" y="181">2</text></g><g class="step-marker" data-step="3" data-step-label="Prepare" aria-label="Step 3: Prepare"><circle class="step-badge" cx="381" cy="251" r="15"/><text class="step-number" x="381" y="251">3</text></g><g class="step-marker" data-step="4" data-step-label="Key" aria-label="Step 4: Key"><circle class="step-badge" cx="761" cy="331" r="15"/><text class="step-number" x="761" y="331">4</text></g><g class="step-marker" data-step="5" data-step-label="Prove" aria-label="Step 5: Prove"><circle class="step-badge" cx="761" cy="367" r="15"/><text class="step-number" x="761" y="367">5</text></g><g class="step-marker" data-step="6" data-step-label="Return" aria-label="Step 6: Return"><circle class="step-badge" cx="381" cy="441" r="15"/><text class="step-number" x="381" y="441">6</text></g><g class="step-marker" data-step="7" data-step-label="Publish" aria-label="Step 7: Publish"><circle class="step-badge" cx="191" cy="521" r="15"/><text class="step-number" x="191" y="521">7</text></g><g class="step-marker" data-step="8" data-step-label="Arrive" aria-label="Step 8: Arrive"><circle class="step-badge" cx="381" cy="616" r="15"/><text class="step-number" x="381" y="616">8</text></g></svg>
